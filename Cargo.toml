[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-http-client",
    "crates/lenso-capability-http-endpoint",
    "crates/lenso-capability-http-endpoint-macros",
    "crates/lenso-http-egress",
    "crates/lenso-http-auth",
    "crates/lenso-web-ingress",
    "crates/lenso-openapi",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = true
repository = "https://github.com/LioRael/lenso-web"
rust-version = "1.94"

[workspace.dependencies]
bytes = "1.12"
futures = "0.3"
http = "1"
proc-macro2 = "1.0"
quote = "1.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
syn = { version = "2.0", features = ["full"] }
tokio = { version = "1.52", features = ["net", "rt", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
