[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-http-client",
    "crates/lenso-capability-http-endpoint",
    "crates/lenso-capability-http-endpoint-macros",
    "crates/lenso-http-egress-plugin",
    "crates/lenso-http-auth",
    "crates/lenso-web-ingress-plugin",
    "crates/lenso-openapi-plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = true
repository = "https://github.com/LioRael/lenso-web"
rust-version = "1.94"

[workspace.dependencies]
bytes = "1.12"
futures = "0.3"
http = "1"
lenso = { version = "0.5.0", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "d15b45384b3ad7d8734dac06485b36c5e0d3eb79" }
lenso-app-plan = { version = "0.3.0", git = "https://github.com/LioRael/lenso", rev = "cd35675a191d815b690c8889756dfe859a0e4d7b" }
lenso-contract-authoring = { version = "0.1.1", git = "https://github.com/LioRael/lenso-protocols", rev = "239381609da51158d0aae5991bc0d074f742ef42" }
lenso-contract-codegen = { version = "0.6.3", git = "https://github.com/LioRael/lenso-protocols", rev = "239381609da51158d0aae5991bc0d074f742ef42" }
lenso-contract-runtime = { version = "0.1.3", git = "https://github.com/LioRael/lenso-protocols", rev = "239381609da51158d0aae5991bc0d074f742ef42" }
lenso-kernel = { version = "0.2.0", git = "https://github.com/LioRael/lenso", rev = "cd35675a191d815b690c8889756dfe859a0e4d7b" }
lenso-native-adapter = { version = "0.3.0", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "d15b45384b3ad7d8734dac06485b36c5e0d3eb79" }
lenso-plugin-authoring = { version = "0.1.1", git = "https://github.com/LioRael/lenso-protocols", rev = "239381609da51158d0aae5991bc0d074f742ef42" }
lenso-runner = { version = "0.2.0", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "d15b45384b3ad7d8734dac06485b36c5e0d3eb79" }
proc-macro2 = "1.0"
quote = "1.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
syn = { version = "2.0", features = ["full"] }
tokio = { version = "1.52", features = ["net", "rt", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
