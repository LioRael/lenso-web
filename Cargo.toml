[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-http-client",
    "crates/lenso-capability-http-endpoint",
    "crates/lenso-capability-http-endpoint-macros",
    "crates/lenso-http-egress-plugin",
    "crates/lenso-http-auth",
    "crates/lenso-web-ingress-plugin",
    "crates/lenso-openapi-plugin",
    "examples/greetings-http-plugin",
    "tests/fixtures/query-endpoint-plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = true
repository = "https://github.com/LioRael/lenso-web"
rust-version = "1.94"

[workspace.dependencies]
bytes = "1.12"
futures = "0.3"
http = "1"
lenso = { version = "0.5.0" }
lenso-app-plan = { version = "0.3.0" }
lenso-contract-authoring = { version = "0.1.1" }
lenso-contract-codegen = { version = "=0.6.4" }
lenso-contract-runtime = { version = "0.1.3" }
lenso-kernel = { version = "0.2.0" }
lenso-native-adapter = { version = "0.3.0" }
lenso-plugin-authoring = { version = "0.1.1" }
lenso-runner = { version = "0.2.0" }
proc-macro2 = "1.0"
quote = "1.0"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
syn = { version = "2.0", features = ["full"] }
tokio = { version = "1.52", features = ["net", "rt", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
