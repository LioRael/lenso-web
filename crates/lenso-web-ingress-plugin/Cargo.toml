[package]
name = "lenso-web-ingress-plugin"
version = "0.4.2"
description = "General-purpose linked Rust HTTP Ingress Plugin for Lenso backends."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
exclude = ["tests/repository_ownership.rs"]

[package.metadata.lenso]
plugin-id = "lenso.web-ingress"
root-slot = "http-ingress"

[features]
default = ["native"]
native = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "tokio/net", "tokio/rt", "tokio/time"]

[dependencies]
bytes = "1"
futures.workspace = true
http = "1"
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", optional = true, features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", optional = true, features = ["server-auto", "tokio"] }
lenso.workspace = true
lenso-app-plan.workspace = true
lenso-capability-http-endpoint = { version = "0.3.1", path = "../lenso-capability-http-endpoint" }
lenso-capability-http-stream-endpoint = { version = "0.1.1", path = "../lenso-capability-http-stream-endpoint" }
lenso-kernel.workspace = true
lenso-native-adapter.workspace = true
matchit = "0.8"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.52", default-features = false, features = ["macros", "sync"] }

[dev-dependencies]
lenso-web-http-parity-fixture = { path = "../../tests/fixtures/http-parity-plugin" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "1", features = ["client", "http2"] }
lenso-auth-sdk = { version = "0.2.3" }
lenso-capability-auth = { version = "0.2.0" }
lenso-http-auth = { path = "../lenso-http-auth" }
lenso-web-query-endpoint-fixture = { path = "../../tests/fixtures/query-endpoint-plugin" }
lenso-runner.workspace = true
serde_json.workspace = true
stats_alloc = "0.1.10"
time = "0.3"
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["limit", "request-id", "sensitive-headers", "set-header"] }

[[bench]]
name = "http_ingress"
harness = false

[[bench]]
name = "http_ingress_allocations"
harness = false

[[bench]]
name = "http_ingress_process"
harness = false

[[bench]]
name = "web_execution_profile"
harness = false

[lints]
workspace = true
