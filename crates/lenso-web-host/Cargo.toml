[package]
name = "lenso-web-host"
version = "0.1.0"
description = "Linked native Host helper that starts Web Ingress and bound HTTP Endpoint Plugins."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bytes = "1"
futures.workspace = true
http = "1"
lenso-app-plan.workspace = true
lenso-capability-http-endpoint = { path = "../lenso-capability-http-endpoint", version = "0.3.2" }
lenso-capability-http-stream-endpoint = { path = "../lenso-capability-http-stream-endpoint", version = "0.1.1" }
lenso-capability-websocket-endpoint = { path = "../lenso-capability-websocket-endpoint", version = "0.1.0" }
lenso-kernel.workspace = true
lenso-native-adapter.workspace = true
lenso-runner.workspace = true
lenso-web-ingress-plugin = { path = "../lenso-web-ingress-plugin", version = "0.4.5" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
lenso-web-greetings-plugin-example = { path = "../../examples/greetings-http-plugin" }
lenso-web-query-endpoint-fixture = { path = "../../tests/fixtures/query-endpoint-plugin" }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }

[lints]
workspace = true
