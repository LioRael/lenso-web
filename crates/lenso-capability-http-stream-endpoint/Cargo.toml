[package]
name = "lenso-capability-http-stream-endpoint"
version = "0.1.0"
description = "Portable streaming HTTP Endpoint Capability contract for Lenso backend Plugins."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.lenso.contract]
descriptor = "capability.json"
projection = "rust"
output = "src/generated.rs"

[dependencies]
futures.workspace = true
lenso-contract-runtime.workspace = true
lenso-kernel.workspace = true
lenso-plugin-authoring.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
lenso-contract-codegen = "=0.9.0"
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
