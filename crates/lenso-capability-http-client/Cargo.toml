[package]
name = "lenso-capability-http-client"
version = "0.2.2"
description = "Portable outbound HTTP Client Capability contract for Lenso Modules."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
futures.workspace = true
lenso-contract-runtime = "0.1.0"
lenso-kernel = "0.1.9"
lenso-module-authoring = { version = "0.1.0", git = "https://github.com/LioRael/lenso-protocols", rev = "c1f1dce2cf93420f924d37074035f170e4153fc5" }
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
lenso-contract-codegen = { version = "0.6.1", git = "https://github.com/LioRael/lenso-protocols", rev = "c1f1dce2cf93420f924d37074035f170e4153fc5" }
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
