[package]
name = "lenso-capability-http-endpoint"
version = "0.3.0"
description = "Portable HTTP Endpoint Capability contract for Lenso backend Plugins."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.lenso]
plugin-id = "lenso.http.endpoint.authoring-tests"
root-slot = "web"

[package.metadata.lenso.contract]
descriptor = "capability.json"
projection = "rust"
output = "src/generated.rs"

[dependencies]
futures.workspace = true
http.workspace = true
lenso-capability-http-endpoint-macros = { path = "../lenso-capability-http-endpoint-macros", version = "0.1.4" }
lenso-contract-runtime = "0.2.0"
lenso-kernel = "0.3.5"
lenso-plugin-authoring = "0.2.0"
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true

[dev-dependencies]
lenso.workspace = true

[build-dependencies]
lenso-contract-codegen = "=0.9.0"
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
