[package]
name = "lenso-http-egress-plugin"
version = "0.2.2"
description = "Policy-bounded linked Rust HTTP Egress Plugin for Lenso backends."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.lenso]
plugin-id = "lenso.http-egress"
root-slot = "http-clients"

[dependencies]
bytes.workspace = true
futures.workspace = true
lenso.workspace = true
lenso-capability-http-client = { version = "0.2.3", path = "../lenso-capability-http-client" }
lenso-kernel.workspace = true
lenso-native-adapter.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
lenso-app-plan.workspace = true
lenso-runner.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }

[lints]
workspace = true
