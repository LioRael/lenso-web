[package]
name = "lenso-http-egress-plugin"
version = "0.3.2"
description = "Policy-bounded linked Rust HTTP Egress Plugin for Lenso backends."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.lenso]
plugin-id = "lenso.http-egress"
root-slot = "http-clients"

[features]
default = ["native"]
native = ["dep:reqwest", "tokio/net", "tokio/rt"]
workers = ["dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]

[dependencies]
http.workspace = true
url = "2.5"
lenso-app-plan.workspace = true
bytes.workspace = true
futures.workspace = true
lenso.workspace = true
lenso-capability-http-client = { version = "0.3.0", path = "../lenso-capability-http-client" }
lenso-kernel.workspace = true
lenso-native-adapter.workspace = true
lenso-native-adapter-macros.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.52", default-features = false, features = ["sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
lenso-app-plan.workspace = true
lenso-runner.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }

[lints]
workspace = true
