[package]
name = "lenso-web-ingress"
version = "0.1.0"
description = "General-purpose linked Rust HTTP Ingress Module for Lenso vNext backends."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64.workspace = true
futures.workspace = true
lenso-capability-http-endpoint = { version = "0.1.0", path = "../lenso-capability-http-endpoint" }
lenso-kernel = "0.1.1"
lenso-native-adapter = "0.1.1"
matchit = "0.8"
tokio.workspace = true
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["limit", "request-id", "sensitive-headers", "set-header"] }

[dev-dependencies]
lenso-app-plan = "0.1.0"
lenso-authoring = "0.1.1"
lenso-runner = "0.1.1"
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }

[lints]
workspace = true
