[package]
name = "lenso-web-ingress"
version = "0.3.0"
description = "General-purpose linked Rust HTTP Ingress Module for Lenso backends."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bytes = "1"
futures.workspace = true
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
lenso-capability-http-endpoint = { version = "0.2.0", path = "../lenso-capability-http-endpoint" }
lenso-kernel = "0.1.4"
lenso-native-adapter = "0.1.1"
matchit = "0.8"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "1", features = ["client", "http2"] }
lenso-app-plan = "0.1.0"
lenso-authoring = "0.1.5"
lenso-runner = "0.1.3"
serde_json.workspace = true
stats_alloc = "0.1.10"
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["limit", "request-id", "sensitive-headers", "set-header"] }

[[bench]]
name = "http_ingress"
harness = false

[[bench]]
name = "http_ingress_allocations"
harness = false

[[bench]]
name = "http_ingress_process"
harness = false

[lints]
workspace = true
