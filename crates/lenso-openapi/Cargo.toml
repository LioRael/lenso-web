[package]
name = "lenso-openapi"
version = "0.1.1"
description = "Optional OpenAPI 3.1 document Module for explicitly bound Lenso HTTP Endpoints."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
futures.workspace = true
lenso-capability-http-endpoint = { version = "0.2.4", path = "../lenso-capability-http-endpoint" }
lenso-kernel = "0.1.4"
lenso-native-adapter = "0.1.1"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
lenso-app-plan = "0.1.2"
lenso-runner = "0.1.3"
lenso-web-ingress = { version = "0.3.4", path = "../lenso-web-ingress" }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }

[lints]
workspace = true
