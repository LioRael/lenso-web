name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Check generated contracts
        run: |
          cargo install --locked --version '=0.9.0' lenso-contract-codegen
          lenso-contract-codegen workspace check --manifest-path Cargo.toml
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check portable Capability packages
        run: |
          for target in wasm32-unknown-unknown wasm32-wasip2; do
            cargo check --locked --manifest-path crates/lenso-capability-http-client/Cargo.toml --target "$target"
            cargo check --locked --manifest-path crates/lenso-capability-http-endpoint/Cargo.toml --target "$target"
            cargo check --locked --manifest-path crates/lenso-capability-http-stream-endpoint/Cargo.toml --target "$target"
            cargo check --locked --manifest-path crates/lenso-http-auth/Cargo.toml --target "$target"
          done
      - name: Check event HTTP ingress
        run: cargo check --locked -p lenso-web-ingress-plugin --no-default-features --target wasm32-unknown-unknown
      - name: Check event HTTP Egress
        run: cargo check --locked -p lenso-http-egress-plugin --no-default-features --features workers --target wasm32-unknown-unknown
      - name: Check event Fetch bridge
        run: node --test crates/lenso-http-egress-plugin/js/event-fetch.test.mjs
      - name: Package Capability crates
        run: |
          cargo package --locked --manifest-path crates/lenso-capability-http-client/Cargo.toml
          cargo package --locked --manifest-path crates/lenso-capability-http-endpoint-macros/Cargo.toml
          cargo package --locked --manifest-path crates/lenso-capability-http-endpoint/Cargo.toml
          cargo package --locked --manifest-path crates/lenso-capability-http-stream-endpoint/Cargo.toml
          cargo package --locked --manifest-path crates/lenso-http-auth/Cargo.toml
          cargo package --locked --manifest-path crates/lenso-openapi-plugin/Cargo.toml
          if cargo search --limit 1 lenso-capability-http-stream-endpoint | grep -q '^lenso-capability-http-stream-endpoint = "0.1.1"'; then
            cargo package --locked --manifest-path crates/lenso-web-ingress-plugin/Cargo.toml
          else
            echo "Skipping ingress verification until its new stream Capability dependency is published"
          fi
      - name: Package HTTP Egress release set
        run: cargo package --locked --manifest-path crates/lenso-http-egress-plugin/Cargo.toml
