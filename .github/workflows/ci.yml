name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Check repository ownership
        run: ./scripts/check-repository-boundary.sh
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check portable Capability packages
        run: |
          cargo check --locked -p lenso-capability-http-client -p lenso-capability-http-endpoint -p lenso-http-auth --target wasm32-unknown-unknown
          cargo check --locked -p lenso-capability-http-client -p lenso-capability-http-endpoint -p lenso-http-auth --target wasm32-wasip2
      - name: Package Capability crates
        run: |
          cargo package --locked -p lenso-capability-http-client
          # Package the Endpoint release set together so Cargo can resolve
          # same-release dependencies before their first publication.
          cargo package --locked --no-verify \
            -p lenso-capability-http-endpoint-macros \
            -p lenso-capability-http-endpoint \
            -p lenso-http-auth \
            -p lenso-openapi \
            -p lenso-web-ingress
      - name: Package HTTP Egress
        run: cargo package --locked --no-verify -p lenso-http-egress
