name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Check repository ownership
        run: ./scripts/check-repository-boundary.sh
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check portable Capability packages
        run: |
          cargo check --locked -p lenso-capability-http-client -p lenso-capability-http-endpoint --target wasm32-unknown-unknown
          cargo check --locked -p lenso-capability-http-client -p lenso-capability-http-endpoint --target wasm32-wasip2
      - name: Package Capability crates
        run: |
          cargo package --locked -p lenso-capability-http-client
          # Package the new macro and its Endpoint consumer together so Cargo
          # can resolve the same-release dependency before its first publish.
          cargo package --locked --no-verify \
            -p lenso-capability-http-endpoint-macros \
            -p lenso-capability-http-endpoint
      - name: Package Capability consumers
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'release') }}
        # Cargo verifies path dependencies against crates.io, where the new Capability ABI does
        # not exist until the dependency-ordered release. The workspace gates above compile,
        # test, and lint these consumers against the exact local Capability sources. Release PRs
        # skip archive preparation until those Capability versions exist in the registry.
        run: |
          cargo package --locked --no-verify -p lenso-http-egress
          cargo package --locked --no-verify -p lenso-web-ingress
