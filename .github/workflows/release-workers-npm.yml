name: Release Workers npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Reviewed package directory
        required: true
        type: choice
        options:
          - crates/lenso-http-egress-plugin/js
          - crates/lenso-web-ingress-plugin/js
      version:
        description: Exact reviewed package version
        required: true
        type: string
      commit:
        description: Exact reviewed main commit SHA
        required: true
        type: string
      publish:
        description: Publish using the configured npm Trusted Publisher
        type: boolean
        default: false

permissions: {}

concurrency:
  group: workers-npm-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_PATH: ${{ inputs.package }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Verify exact version and source
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync(process.env.PACKAGE_PATH + "/package.json")); if (p.version !== process.env.RELEASE_VERSION || p.private) process.exit(1);'
      - name: Install test dependencies
        run: npm install --prefix "$PACKAGE_PATH" --ignore-scripts --package-lock=false
      - name: Test package
        run: npm test --prefix "$PACKAGE_PATH"
      - name: Pack reviewed artifact
        run: |
          mkdir release-artifacts
          npm pack "./$PACKAGE_PATH" --pack-destination release-artifacts
          sha256sum release-artifacts/*.tgz
      - name: Verify npm artifact resolution
        run: npm publish ./release-artifacts/*.tgz --dry-run --access public --provenance=false
      - name: Publish verified artifact
        if: inputs.publish
        run: npm publish ./release-artifacts/*.tgz --access public --provenance
